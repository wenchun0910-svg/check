<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檔案繳交查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">檔案繳交查詢系統</h1>
        
        <!-- 控制面板 -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8 p-4 bg-blue-50 rounded-md border border-blue-100">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label for="classSelect" class="font-semibold whitespace-nowrap">選擇班級：</label>
                <select id="classSelect" class="w-full md:w-48 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:bg-gray-200" disabled>
                    <option value="">載入班級中...</option>
                </select>
            </div>
            <button id="queryBtn" onclick="queryData()" class="w-full md:w-auto px-6 py-2 bg-blue-500 text-white font-semibold rounded hover:bg-blue-600 disabled:bg-gray-400 transition-colors" disabled>
                查詢繳交狀態
            </button>
        </div>

        <!-- 狀態與提示訊息 -->
        <div id="statusMessage" class="text-center font-medium my-4 text-gray-600">
            請先等待班級列表載入完成。
        </div>

        <!-- 查詢結果表格 -->
        <div class="overflow-x-auto hidden" id="resultContainer">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-gray-300">
                        <th class="p-3">座號</th>
                        <th class="p-3">姓名</th>
                        <th class="p-3 text-center">狀態</th>
                        <th class="p-3 text-center">繳交時間</th>
                        <th class="p-3 text-center">檔案</th>
                    </tr>
                </thead>
                <tbody id="resultBody" class="divide-y divide-gray-200">
                    <!-- 資料將透過 JS 動態產生 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 請將下方的網址替換成您最新部署的 Apps Script 網址
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRqQ3AKH-aaAwxsHgZOzmB1AepUUs9E8AwmXJqUwAiNgy-pC-PdY2fZIIP0uanJCFl/exec'; 

        const classSelect = document.getElementById('classSelect');
        const queryBtn = document.getElementById('queryBtn');
        const statusMessage = document.getElementById('statusMessage');
        const resultContainer = document.getElementById('resultContainer');
        const resultBody = document.getElementById('resultBody');

        // 頁面載入時，自動去後端抓取班級列表
        window.onload = async function() {
            if (SCRIPT_URL === '請貼上您的_Apps_Script_網址') {
                statusMessage.innerHTML = '<span class="text-red-500">錯誤：請先在 HTML 檔案中設定 SCRIPT_URL 網址！</span>';
                return;
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getClasses`);
                const result = await response.json();

                if (result.success) {
                    classSelect.innerHTML = '<option value="">請選擇班級</option>';
                    result.data.forEach(className => {
                        const option = document.createElement('option');
                        option.value = className;
                        option.textContent = className;
                        classSelect.appendChild(option);
                    });
                    
                    classSelect.disabled = false;
                    queryBtn.disabled = false;
                    statusMessage.textContent = '班級載入完成，請選擇班級並點擊查詢。';
                } else {
                    statusMessage.innerHTML = `<span class="text-red-500">後端錯誤：${result.error}</span>`;
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                statusMessage.innerHTML = '<span class="text-red-500">連線失敗！請按 F12 檢查 Console 是否有 CORS 錯誤。</span>';
            }
        };

        // 點擊查詢按鈕的動作
        async function queryData() {
            const selectedClass = classSelect.value;
            if (!selectedClass) {
                alert('請先選擇班級！');
                return;
            }

            // 進入載入狀態
            queryBtn.disabled = true;
            queryBtn.textContent = '查詢中...';
            statusMessage.innerHTML = '<span class="text-blue-500">資料查詢中，請稍候...</span>';
            resultContainer.classList.add('hidden');
            resultBody.innerHTML = '';

            try {
                const response = await fetch(`${SCRIPT_URL}?action=query&className=${encodeURIComponent(selectedClass)}`);
                const result = await response.json();

                if (result.success) {
                    renderTable(result.data);
                    statusMessage.textContent = `顯示 ${selectedClass} 的查詢結果。`;
                    resultContainer.classList.remove('hidden');
                } else {
                    statusMessage.innerHTML = `<span class="text-red-500">查詢失敗：${result.error}</span>`;
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                statusMessage.innerHTML = '<span class="text-red-500">連線發生錯誤，請稍後再試。</span>';
            } finally {
                queryBtn.disabled = false;
                queryBtn.textContent = '查詢繳交狀態';
            }
        }

        // 將資料渲染成表格
        function renderTable(dataList) {
            dataList.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50";

                // 狀態標籤樣式
                const statusHtml = item.isSubmitted 
                    ? `<span class="px-2 py-1 bg-green-100 text-green-700 text-sm rounded-full font-bold">已交</span>`
                    : `<span class="px-2 py-1 bg-red-100 text-red-700 text-sm rounded-full font-bold">未交</span>`;

                // 檔案連結樣式
                const fileHtml = item.fileUrl 
                    ? `<a href="${item.fileUrl}" target="_blank" class="text-blue-500 hover:underline">查看檔案</a>`
                    : `<span class="text-gray-400">-</span>`;
                
                // 時間格式化
                const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleString('zh-TW', {hour12: false}) : '-';

                tr.innerHTML = `
                    <td class="p-3">${item.seatNo}</td>
                    <td class="p-3 font-medium">${item.name}</td>
                    <td class="p-3 text-center">${statusHtml}</td>
                    <td class="p-3 text-center text-sm text-gray-500">${timeStr}</td>
                    <td class="p-3 text-center">${fileHtml}</td>
                `;
                resultBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
